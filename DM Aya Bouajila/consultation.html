<!DOCTYPE> 
<html class="scroll-smooth" >
    <head>
        <title>Digital Marketing HQ</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <main class="min-h-screen bg-sky-100 flex items-center justify-center px-6">
            <form class="w-full max-w-xl bg-white p-10 rounded-xl shadow-lg space-y-6">
                <h2 class="text-4xl font-bold text-center text-gray-700 mb-6">Request a Free Consultation</h2>
                <div>
                    <label class="block text-xl text-gray-600 mb-2">Full Name :</label>
                    <input type="text" required
                        class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-xl
                               focus:outline-none focus:border-blue-400"/>
                </div>

                <div>
                    <label class="block text-xl text-gray-600 mb-2">Email Address :</label>
                    <input type="email" required
                        class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-xl
                               focus:outline-none focus:border-blue-400"/>
                </div>

                <div>
                    <label class="block text-xl text-gray-600 mb-2">Phone Number :</label>
                    <input type="text" required
                        class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-xl
                               focus:outline-none focus:border-blue-400"/>
                </div>
                <div>
                    <label class="block text-xl text-gray-600 mb-2">
                        What service are you interested in?
                    </label>
                    <textarea rows="3" required
                        class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-xl
                               focus:outline-none focus:border-blue-400"></textarea>
               </div>
               <div>
                   <label class="block text-xl text-gray-600 mb-2">Briefly describe your project or goal :</label>
                   <textarea rows="4" required class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-xl focus:outline-none focus:border-blue-400"></textarea>
               </div>
               <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 border-2 border-blue-400 text-blue-400 text-xl py-3 rounded-lg hover:bg-blue-400 hover:text-white transition">Submit</button>
                <button type="reset" class="flex-1 border-2 border-gray-400 text-gray-600 text-xl py-3 rounded-lg hover:bg-gray-200 transition">Clear</button>
               </div>
            </form>
        </main>
    </body>
</html>
